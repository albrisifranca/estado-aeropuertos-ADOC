name: Actualizar datos y publicar

# Dos tareas separadas:
# - "datos" baja las fuentes oficiales cada 5 min y guarda status.json en la rama "datos" (cada corrida programada
#   se queda 40 min actualizando, porque GitHub atrasa los cron).
#   La página lo lee de ahí, así que una demora o traba del despliegue de Pages no frena los datos.
# - "publicar" sólo despliega la página en Pages cuando cambia el código (push o a mano).

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  actions: write

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      # La corrida siguiente espera a que termine la anterior (no la corta a mitad de una vuelta).
      group: datos
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Actualizar cada 5 minutos durante 40 minutos
        # GitHub demora y saltea las tareas programadas (en la práctica corren cada 35-45 min),
        # así que cada corrida se queda actualizando cada 5 minutos hasta que empieza la siguiente.
        env:
          FAA_CLIENT_ID: ${{ secrets.FAA_CLIENT_ID }}
          FAA_CLIENT_SECRET: ${{ secrets.FAA_CLIENT_SECRET }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          inicio=$(date +%s)
          vuelta=1
          while :; do
            t0=$(date +%s)
            echo "::group::Vuelta $vuelta ($(date -u +%H:%M) UTC)"
            if python3 scripts/update_status.py; then
              # Avisos: si fallan, se conserva el estado anterior para no repetir avisos.
              git fetch -q --depth=1 origin datos && git show origin/datos:avisos-estado.json > /tmp/avisos-prev.json || echo '{}' > /tmp/avisos-prev.json
              rm -f data/avisos-estado.json
              node scripts/avisos.mjs /tmp/avisos-prev.json data/avisos-estado.json || echo "Los avisos fallaron en esta vuelta"
              rm -rf /tmp/datos && mkdir -p /tmp/datos && cp data/status.json /tmp/datos/
              cp data/avisos-estado.json /tmp/datos/ 2>/dev/null || cp /tmp/avisos-prev.json /tmp/datos/avisos-estado.json
              (
                cd /tmp/datos
                git init -q -b datos
                git add status.json avisos-estado.json
                git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  commit -qm "Datos $(date -u +%Y-%m-%dT%H:%MZ)"
                # Un solo commit que se reemplaza cada vez: la rama no crece.
                git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" datos
              ) || echo "No se pudo guardar en la rama datos en esta vuelta"
            else
              echo "Sin datos nuevos en esta vuelta"
            fi
            echo "::endgroup::"
            # Con un cambio de código (push): una vuelta y listo.
            [ "${{ github.event_name }}" != "push" ] || break
            vuelta=$((vuelta + 1))
            [ $(( $(date +%s) - inicio )) -lt 2400 ] || break
            espera=$(( 300 - ($(date +%s) - t0) ))
            [ $espera -gt 0 ] && sleep $espera
          done

      - name: Mantener activa la tarea programada
        # GitHub pausa los cron de repos sin actividad a los 60 días; esto la reactiva.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/actualizar.yml/enable" || true

  publicar:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pagina
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar sólo la versión más nueva
        # Si se vuelve a correr una tarea vieja, no pisa la página con código viejo.
        id: vigente
        run: |
          ultimo=$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)
          if [ "$ultimo" = "${{ github.sha }}" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "Versión vieja (${{ github.sha }}); main está en $ultimo. No se publica."; fi

      - uses: actions/checkout@v4
        if: steps.vigente.outputs.ok == '1'

      - name: Armar sitio
        if: steps.vigente.outputs.ok == '1'
        run: |
          mkdir -p _site/data
          cp data/airports.json _site/data/
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/referencia/referencia.json" -o _site/data/referencia.json || true
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/datos/status.json" -o _site/data/status.json \
            || cp data/status.json _site/data/
          {
            printf '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>'
            cat index.html
            printf '</body></html>'
          } > _site/index.html

      - uses: actions/configure-pages@v5
        if: steps.vigente.outputs.ok == '1'

      - uses: actions/upload-pages-artifact@v3
        if: steps.vigente.outputs.ok == '1'
        with:
          path: _site

      - id: deploy
        if: steps.vigente.outputs.ok == '1'
        uses: actions/deploy-pages@v4
