name: Actualizar datos y publicar

# Dos tareas separadas:
# - "datos" corre cada 15 min, baja las fuentes oficiales y guarda status.json en la rama "datos".
#   La página lo lee de ahí, así que una demora o traba del despliegue de Pages no frena los datos.
# - "publicar" sólo despliega la página en Pages cuando cambia el código (push o a mano).

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: datos
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Descargar datos oficiales (NOAA, FAA, EASA, USGS, GDACS)
        env:
          FAA_CLIENT_ID: ${{ secrets.FAA_CLIENT_ID }}
          FAA_CLIENT_SECRET: ${{ secrets.FAA_CLIENT_SECRET }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 scripts/update_status.py

      - name: Avisos al celular (ntfy)
        continue-on-error: true
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          git fetch -q --depth=1 origin datos && git show origin/datos:avisos-estado.json > /tmp/avisos-prev.json || echo '{}' > /tmp/avisos-prev.json
          node scripts/avisos.mjs /tmp/avisos-prev.json data/avisos-estado.json

      - name: Guardar datos en la rama "datos"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/datos && cp data/status.json /tmp/datos/
          # Si el paso de avisos falló, se conserva el estado anterior para no repetir avisos.
          cp data/avisos-estado.json /tmp/datos/ 2>/dev/null || cp /tmp/avisos-prev.json /tmp/datos/avisos-estado.json 2>/dev/null || echo '{}' > /tmp/datos/avisos-estado.json
          cd /tmp/datos
          git init -q -b datos
          git add status.json avisos-estado.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Datos $(date -u +%Y-%m-%dT%H:%MZ)"
          # Un solo commit que se reemplaza cada vez: la rama no crece.
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" datos

      - name: Mantener activa la tarea programada
        # GitHub pausa los cron de repos sin actividad a los 60 días; esto la reactiva.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/actualizar.yml/enable" || true

  publicar:
    if: github.event_name != 'schedule'
    needs: datos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pagina
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Armar sitio
        run: |
          mkdir -p _site/data
          cp data/airports.json _site/data/
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/datos/status.json" -o _site/data/status.json \
            || cp data/status.json _site/data/
          {
            printf '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>'
            cat index.html
            printf '</body></html>'
          } > _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
